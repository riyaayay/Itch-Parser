name: tick2trade-fpga CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSS CAD Suite / Verification Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys python3 python3-pip python3-venv

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest cocotb

      - name: Run T0 Audit (CHAR-1, CHAR-2, CHAR-3)
        run: make audit

      - name: Run Directed Simulation Regression
        run: make sim